<linearGradient id="spectrum"><stop stop-color="#20bcd4"/><stop offset=".34" stop-color="#38c976"/><stop offset=".67" stop-color="#a58af5"/><stop offset="1" stop-color="#f16ca6"/></linearGradient>
<filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
