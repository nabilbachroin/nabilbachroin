<svg xmlns="http://www.w3.org/2000/svg" width="880" height="544" viewBox="0 0 880 544" role="img" aria-labelledby="title description">
<title id="title">Repository Language Mix</title>
<desc id="description">Equal weight per repository. The top strip shows the complete composition. Row bars are relative to the leading language; labels show actual shares.</desc>
<defs>
<linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="20" y1="75" x2="860" y2="75"><stop stop-color="#20bcd4"/><stop offset=".5" stop-color="#a58af5"/><stop offset="1" stop-color="#f16ca6"/></linearGradient>
<filter id="glow" x="-10%" y="-200%" width="120%" height="500%"><feGaussianBlur stdDeviation="2"/></filter>
<clipPath id="composition"><rect x="20" y="110" width="840" height="18" rx="5"/></clipPath>
<linearGradient id="lang-0"><stop stop-color="#188fa1"/><stop offset=".6" stop-color="#20bcd4"/><stop offset="1" stop-color="#5ecfe0"/></linearGradient>
<linearGradient id="lang-1"><stop stop-color="#b96a33"/><stop offset=".6" stop-color="#f48b43"/><stop offset="1" stop-color="#f7ab78"/></linearGradient>
<linearGradient id="lang-2"><stop stop-color="#b48e2b"/><stop offset=".6" stop-color="#edbb38"/><stop offset="1" stop-color="#f2ce70"/></linearGradient>
