<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-labelledby="title desc">
<title id="title">Animated firmware system console mini project</title>
<desc id="desc">A synthetic portfolio simulation showing XInput forwarding, LC3 playback and microphone paths, Opus DSP work, and automatic link recovery. It does not display measured hardware telemetry.</desc>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dce5ec" stroke-width=".6" opacity=".42"/></pattern>
<linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#069fb7"/><stop offset=".38" stop-color="#159f72"/><stop offset=".7" stop-color="#8250df"/><stop offset="1" stop-color="#d34f8c"/></linearGradient>
<filter id="glow" x="-40%" y="-120%" width="180%" height="340%"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".16"/></filter>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0}.trace{stroke-dasharray:8 9;animation:flow 1.7s linear infinite}.audio{animation-duration:2.15s}.led{animation:blink 1.5s ease-in-out infinite}.event{animation:event 12s linear infinite}.e2{animation-delay:-2s}.e3{animation-delay:-4s}.e4{animation-delay:-6s}.e5{animation-delay:-8s}.e6{animation-delay:-10s}.state{animation:state 5s ease-in-out infinite}.s2{animation-delay:-1s}.s3{animation-delay:-2s}.s4{animation-delay:-3s}.s5{animation-delay:-4s}.packet{filter:url(#glow)}@keyframes flow{to{stroke-dashoffset:-34}}@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}@keyframes event{0%,13%{opacity:.72}17%,100%{opacity:.08}}@keyframes state{0%,18%{opacity:1}22%,100%{opacity:.25}}@media(prefers-reduced-motion:reduce){.trace,.led,.event,.state{animation:none}.packet{display:none}}</style>
<rect x=".5" y=".5" width="879" height="479" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<rect x="1" y="1" width="878" height="478" rx="6" fill="url(#grid)" opacity=".52"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" textLength="280.6" lengthAdjust="spacingAndGlyphs">FIRMWARE SYSTEM CONSOLE</text>
<text x="24" y="58" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="start" textLength="333.06" lengthAdjust="spacingAndGlyphs">XINPUT + LC3 FULL-DUPLEX + OPUS DSP / SYNTHETIC DEMO</text>
<rect x="700" y="21" width="156" height="34" rx="4" fill="#edf3f7" stroke="#159f72"/>
<circle class="led" cx="716" cy="38" r="4" fill="#159f72" filter="url(#glow)"/>
<text x="728" y="42" font-size="9.5" font-weight="700" fill="#159f72" text-anchor="start" textLength="98.515" lengthAdjust="spacingAndGlyphs">SIMULATION ACTIVE</text>
<path d="M24 75H856" stroke="url(#spectrum)" stroke-width="1.5"/>
<rect x="24" y="91" width="196" height="38" rx="4" fill="#edf3f7" stroke="#069fb7" stroke-opacity=".8"/>
<circle class="led" cx="36" cy="104" r="3" fill="#069fb7" filter="url(#glow)"/>
<text x="46" y="107" font-size="10" font-weight="700" fill="#1f2328" text-anchor="start" textLength="24.4" lengthAdjust="spacingAndGlyphs">LINK</text>
