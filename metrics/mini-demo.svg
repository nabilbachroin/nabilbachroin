<circle class="state s2" cx="250" cy="397" r="6" fill="#3578e5" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
<text x="250" y="420" font-size="8.5" font-weight="600" fill="#59636e" text-anchor="middle" textLength="51.85" lengthAdjust="spacingAndGlyphs">LINK READY</text>
<circle class="state s3" cx="430" cy="397" r="6" fill="#159f72" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
