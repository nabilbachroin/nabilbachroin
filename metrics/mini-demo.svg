<text x="258" y="107" font-size="10" font-weight="700" fill="#1f2328" text-anchor="start" textLength="42.7" lengthAdjust="spacingAndGlyphs">CONTROL</text>
<text x="248" y="122" font-size="8.5" font-weight="500" fill="#59636e" text-anchor="start" textLength="72.59" lengthAdjust="spacingAndGlyphs">XINPUT REPORTS</text>
<rect x="448" y="91" width="196" height="38" rx="4" fill="#edf3f7" stroke="#159f72" stroke-opacity=".8"/>
<circle class="led" cx="460" cy="104" r="3" fill="#159f72" filter="url(#glow)"/>
<text x="470" y="107" font-size="10" font-weight="700" fill="#1f2328" text-anchor="start" textLength="30.5" lengthAdjust="spacingAndGlyphs">AUDIO</text>
<text x="460" y="122" font-size="8.5" font-weight="500" fill="#59636e" text-anchor="start" textLength="77.775" lengthAdjust="spacingAndGlyphs">FULL-DUPLEX LC3</text>
<rect x="660" y="91" width="196" height="38" rx="4" fill="#edf3f7" stroke="#8250df" stroke-opacity=".8"/>
<circle class="led" cx="672" cy="104" r="3" fill="#8250df" filter="url(#glow)"/>
<text x="682" y="107" font-size="10" font-weight="700" fill="#1f2328" text-anchor="start" textLength="42.7" lengthAdjust="spacingAndGlyphs">DSP LAB</text>
<text x="672" y="122" font-size="8.5" font-weight="500" fill="#59636e" text-anchor="start" textLength="51.85" lengthAdjust="spacingAndGlyphs">LC3 + OPUS</text>
<g filter="url(#soft)"><rect x="20" y="145" width="526" height="194" rx="5" fill="#f6f8fa" stroke="#d0d7de"/></g>
<text x="34" y="168" font-size="10" font-weight="700" fill="#59636e" text-anchor="start" textLength="103.7" lengthAdjust="spacingAndGlyphs">LIVE SIGNAL LANES</text>
<text x="38" y="190" font-size="10.5" font-weight="700" fill="#069fb7" text-anchor="start" textLength="83.265" lengthAdjust="spacingAndGlyphs">XINPUT REPORT</text>
<text x="38" y="205" font-size="8.5" font-weight="500" fill="#59636e" text-anchor="start" textLength="103.7" lengthAdjust="spacingAndGlyphs">CONTROLS -&gt; USB HOST</text>
<path d="M202 194H514" stroke="#c7d2dc" stroke-width="6" stroke-linecap="round"/>
