<circle cx="202" cy="194" r="3" fill="#069fb7"/>
<circle cx="514" cy="194" r="3" fill="#069fb7"/>
<circle class="packet" r="4" fill="#069fb7"><animateMotion path="M514 194H202" dur="3.4s" repeatCount="indefinite"/></circle>
