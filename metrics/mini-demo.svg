<path d="M24 457H856" stroke="url(#spectrum)" stroke-width="1" opacity=".7"/>
<text x="24" y="473" font-size="9" font-weight="600" fill="#59636e" text-anchor="start" textLength="225.09" lengthAdjust="spacingAndGlyphs">SYNTHETIC EVENTS / NOT MEASURED TELEMETRY</text>
