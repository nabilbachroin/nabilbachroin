<text x="610" y="420" font-size="8.5" font-weight="600" fill="#59636e" text-anchor="middle" textLength="25.925" lengthAdjust="spacingAndGlyphs">RETRY</text>
<circle class="state s5" cx="802" cy="397" r="6" fill="#d34f8c" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
