<text x="38" y="294" font-size="10.5" font-weight="700" fill="#d34f8c" text-anchor="start" textLength="89.67" lengthAdjust="spacingAndGlyphs">LC3 MICROPHONE</text>
<text x="38" y="309" font-size="8.5" font-weight="500" fill="#59636e" text-anchor="start" textLength="108.885" lengthAdjust="spacingAndGlyphs">MIC / ADC -&gt; USB HOST</text>
<path d="M202 298H514" stroke="#c7d2dc" stroke-width="6" stroke-linecap="round"/>
<path class="trace audio" d="M202 298H514" stroke="#d34f8c" stroke-width="2" stroke-linecap="round"/>
<circle cx="202" cy="298" r="3" fill="#d34f8c"/>
<circle cx="514" cy="298" r="3" fill="#d34f8c"/>
<circle class="packet" r="4" fill="#d34f8c"><animateMotion path="M514 298H202" dur="3.4s" repeatCount="indefinite"/></circle>
