<text x="612" y="187" font-size="9.2" font-weight="600" fill="#1f2328" text-anchor="start" textLength="56.12" lengthAdjust="spacingAndGlyphs">LINK_READY</text>
<rect class="event e2" x="576" y="198" width="270" height="19" rx="3" fill="#3578e5"/>
