<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-labelledby="title desc">
<title id="title">Animated low-latency wireless audio and XInput signal flow</title>
<desc id="desc">Conceptual end-to-end paths between a USB host, dongle firmware, BLE ISO link, joypad firmware and device input-output. XInput and microphone data travel toward the host; playback audio travels toward the joypad.</desc>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dce5ec" stroke-width=".6" opacity=".45"/></pattern>
<linearGradient id="header" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#069fb7"/><stop offset=".48" stop-color="#8c55d9"/><stop offset="1" stop-color="#d34f8c"/></linearGradient>
<linearGradient id="control" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#069fb7"/><stop offset="1" stop-color="#3578e5"/></linearGradient>
<linearGradient id="audio" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#159f72"/><stop offset=".5" stop-color="#8c55d9"/><stop offset="1" stop-color="#d34f8c"/></linearGradient>
<filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".18"/></filter>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0}.trace{stroke-dasharray:7 9;animation:flow 1.7s linear infinite}.trace.audio{animation-duration:2.1s}.scan{animation:scan 3.6s ease-in-out infinite}.led{animation:blink 1.8s ease-in-out infinite}.packet{filter:url(#glow)}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes scan{0%,100%{opacity:.15;transform:translateX(-30px)}50%{opacity:.7;transform:translateX(30px)}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.scan,.led{animation:none}.packet{display:none}}</style>
<rect x=".5" y=".5" width="879" height="369" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<rect x="1" y="1" width="878" height="368" rx="6" fill="url(#grid)" opacity=".55"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2328" text-anchor="start" textLength="329.4" lengthAdjust="spacingAndGlyphs">LOW-LATENCY WIRELESS SYSTEM</text>
<text x="24" y="57" font-size="10.5" font-weight="600" fill="#59636e" text-anchor="start" textLength="281.82" lengthAdjust="spacingAndGlyphs">FULL-DUPLEX AUDIO + XINPUT / CONCEPTUAL VIEW</text>
<path d="M24 74H856" stroke="url(#header)" stroke-width="1.5"/>
<path class="scan" d="M24 74H170" stroke="url(#header)" stroke-width="4" filter="url(#glow)"/>
<text x="79" y="99" font-size="9.5" font-weight="700" fill="#59636e" text-anchor="middle" textLength="46.36" lengthAdjust="spacingAndGlyphs">USB HOST</text>
<text x="246" y="99" font-size="9.5" font-weight="700" fill="#59636e" text-anchor="middle" textLength="69.54" lengthAdjust="spacingAndGlyphs">DONGLE / DSP</text>
<text x="420" y="99" font-size="9.5" font-weight="700" fill="#59636e" text-anchor="middle" textLength="52.155" lengthAdjust="spacingAndGlyphs">BLE / ISO</text>
<text x="594" y="99" font-size="9.5" font-weight="700" fill="#59636e" text-anchor="middle" textLength="69.54" lengthAdjust="spacingAndGlyphs">JOYPAD / DSP</text>
