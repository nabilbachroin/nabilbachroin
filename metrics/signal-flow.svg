<text x="24" y="204" font-size="9.5" font-weight="700" fill="#159f72" text-anchor="start" textLength="179.645" lengthAdjust="spacingAndGlyphs">PLAYBACK AUDIO   HOST -&gt; DEVICE</text>
<text x="24" y="289" font-size="9.5" font-weight="700" fill="#d34f8c" text-anchor="start" textLength="191.235" lengthAdjust="spacingAndGlyphs">MICROPHONE AUDIO   DEVICE -&gt; HOST</text>
