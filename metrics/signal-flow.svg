<path class="trace control" d="M852 152H24" fill="none" stroke="url(#control)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#control)"><animateMotion path="M852 152H24" dur="4.6s" begin="0s" repeatCount="indefinite"/></circle>
<path d="M24 237H852" fill="none" stroke="#c7d2dc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
