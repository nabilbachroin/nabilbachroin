<path class="trace audio" d="M852 322H24" fill="none" stroke="url(#header)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#header)"><animateMotion path="M852 322H24" dur="4.6s" begin="1.4s" repeatCount="indefinite"/></circle>
