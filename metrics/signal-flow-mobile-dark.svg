<path class="trace control" d="M340 132H20" fill="none" stroke="url(#control)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#control)"><animateMotion path="M340 132H20" dur="3.2s" begin="0s" repeatCount="indefinite"/></circle>
<path d="M20 229H340" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
