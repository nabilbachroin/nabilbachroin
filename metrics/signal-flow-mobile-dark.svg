<svg xmlns="http://www.w3.org/2000/svg" width="360" height="438" viewBox="0 0 360 438" role="img" aria-labelledby="title desc">
<title id="title">Animated low-latency wireless audio and XInput signal flow</title>
<desc id="desc">Three conceptual paths between host, dongle, BLE ISO, joypad and device input-output. Microphone PCM capture starts at the joypad audio codec and reaches the host through joypad LC3 encode, wireless uplink, dongle LC3 decode and USB microphone input.</desc>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#25303b" stroke-width=".6" opacity=".45"/></pattern>
<linearGradient id="header" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="340" y2="0"><stop stop-color="#35d4e8"/><stop offset=".48" stop-color="#b889ff"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<linearGradient id="control" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="340" y2="0"><stop stop-color="#35d4e8"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="audio" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="340" y2="0"><stop stop-color="#39d98a"/><stop offset=".5" stop-color="#b889ff"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".18"/></filter>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0}.trace{stroke-dasharray:7 9;animation:flow 1.7s linear infinite}.trace.audio{animation-duration:2.1s}.scan{animation:scan 3.6s ease-in-out infinite}.led{animation:blink 1.8s ease-in-out infinite}.packet{filter:url(#glow)}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes scan{0%,100%{opacity:.15;transform:translateX(-30px)}50%{opacity:.7;transform:translateX(30px)}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.scan,.led{animation:none}.packet{display:none}}</style>
<rect x=".5" y=".5" width="359" height="437" rx="6" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="358" height="436" rx="6" fill="url(#grid)" opacity=".55"/>
<text x="20" y="33" font-size="17" font-weight="700" fill="#e6edf3" text-anchor="start" textLength="238.51" lengthAdjust="spacingAndGlyphs">WIRELESS AUDIO + XINPUT</text>
<text x="20" y="53" font-size="10" font-weight="600" fill="#8b949e" text-anchor="start" textLength="164.7" lengthAdjust="spacingAndGlyphs">DONGLE / JOYPAD SIGNAL FLOW</text>
<path d="M20 69H340" stroke="url(#header)" stroke-width="1.5"/>
<path class="scan" d="M20 69H115" stroke="url(#header)" stroke-width="4" filter="url(#glow)"/>
<text x="20" y="96" font-size="9.5" font-weight="700" fill="#35d4e8" text-anchor="start" textLength="168.055" lengthAdjust="spacingAndGlyphs">XINPUT / HID   DEVICE -&gt; HOST</text>
<text x="20" y="193" font-size="9.5" font-weight="700" fill="#39d98a" text-anchor="start" textLength="179.645" lengthAdjust="spacingAndGlyphs">PLAYBACK AUDIO   HOST -&gt; DEVICE</text>
<text x="20" y="290" font-size="9.5" font-weight="700" fill="#f778ba" text-anchor="start" textLength="191.235" lengthAdjust="spacingAndGlyphs">MICROPHONE AUDIO   DEVICE -&gt; HOST</text>
