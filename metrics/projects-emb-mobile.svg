<g transform="translate(0,0)"><g stroke="#536170" stroke-width="1.2" fill="none"><rect x="18" y="109" width="9" height="8" rx="1.5"/><path d="M19 109 v-3 a3 3 0 0 1 6 0 v3"/></g><text x="35" y="116" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" textLength="281.82" lengthAdjust="spacingAndGlyphs">Licensed game controller firmware</text><text x="18" y="153" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="320.25" lengthAdjust="spacingAndGlyphs">USB XInput, BLE HID, dual-mode pairing and</text><text x="18" y="171" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="213.5" lengthAdjust="spacingAndGlyphs">USB audio on a single device</text><rect x="18" y="201" width="24.71" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="27" y="216" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="6.71" lengthAdjust="spacingAndGlyphs">C</text><rect x="48.71" y="201" width="38.13" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="57.71" y="216" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="20.13" lengthAdjust="spacingAndGlyphs">BLE</text><rect x="92.84" y="201" width="64.97" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="101.84" y="216" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="46.97" lengthAdjust="spacingAndGlyphs">USB HID</text><text x="18" y="247" font-size="10" font-weight="400" fill="#536170" text-anchor="start" textLength="73.2" lengthAdjust="spacingAndGlyphs">REPO COMMITS</text><rect x="18" y="260" width="256" height="7" rx="3.5" fill="#eaeef2" /><rect x="18" y="260" width="181.677" height="7" rx="3.5" fill="url(#gradient-emb)" /><text x="342" y="268" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end" textLength="23.79" lengthAdjust="spacingAndGlyphs">110</text><rect x="18" y="284" width="324" height="1" rx="0" fill="#eaeef2" /><g stroke="#536170" stroke-width="1.2" fill="none"><rect x="18" y="302" width="9" height="8" rx="1.5"/><path d="M19 302 v-3 a3 3 0 0 1 6 0 v3"/></g><text x="35" y="309" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" textLength="273.28" lengthAdjust="spacingAndGlyphs">Ultra-low-latency wireless HID &amp;</text><text x="35" y="329" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" textLength="42.7" lengthAdjust="spacingAndGlyphs">audio</text><text x="18" y="366" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="289.75" lengthAdjust="spacingAndGlyphs">The latency-critical path for wireless</text><text x="18" y="384" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="259.25" lengthAdjust="spacingAndGlyphs">input and audio: radio scheduling,</text><text x="18" y="402" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="228.75" lengthAdjust="spacingAndGlyphs">buffering and latency analysis</text><rect x="18" y="432" width="24.71" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="27" y="447" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="6.71" lengthAdjust="spacingAndGlyphs">C</text><rect x="48.71" y="432" width="38.13" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="57.71" y="447" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="20.13" lengthAdjust="spacingAndGlyphs">BLE</text><rect x="92.84" y="432" width="44.84" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="101.84" y="447" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="26.84" lengthAdjust="spacingAndGlyphs">RTOS</text><text x="18" y="478" font-size="10" font-weight="400" fill="#536170" text-anchor="start" textLength="73.2" lengthAdjust="spacingAndGlyphs">REPO COMMITS</text><rect x="18" y="491" width="256" height="7" rx="3.5" fill="#eaeef2" /><rect x="18" y="491" width="135.432" height="7" rx="3.5" fill="url(#gradient-emb)" /><text x="342" y="499" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end" textLength="15.86" lengthAdjust="spacingAndGlyphs">82</text><rect x="18" y="515" width="324" height="1" rx="0" fill="#eaeef2" /><g stroke="#536170" stroke-width="1.2" fill="none"><rect x="18" y="533" width="9" height="8" rx="1.5"/><path d="M19 533 v-3 a3 3 0 0 1 6 0 v3"/></g><text x="35" y="540" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" textLength="230.58" lengthAdjust="spacingAndGlyphs">Audio codec DSP development</text><text x="18" y="577" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="266.875" lengthAdjust="spacingAndGlyphs">Opus and LC3 codec development on a</text><text x="18" y="595" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="305" lengthAdjust="spacingAndGlyphs">resource-constrained DSP core, optimised</text><text x="18" y="613" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="137.25" lengthAdjust="spacingAndGlyphs">at the cycle level</text><rect x="18" y="643" width="24.71" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="27" y="658" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="6.71" lengthAdjust="spacingAndGlyphs">C</text><rect x="48.71" y="643" width="71.68" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="57.71" y="658" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="53.68" lengthAdjust="spacingAndGlyphs">Assembly</text><rect x="126.39" y="643" width="38.13" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="135.39" y="658" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="20.13" lengthAdjust="spacingAndGlyphs">DSP</text><text x="18" y="689" font-size="10" font-weight="400" fill="#536170" text-anchor="start" textLength="73.2" lengthAdjust="spacingAndGlyphs">REPO COMMITS</text><rect x="18" y="702" width="256" height="7" rx="3.5" fill="#eaeef2" /><text x="342" y="710" font-size="13" font-weight="600" fill="#1f2328" text-anchor="end" textLength="23.79" lengthAdjust="spacingAndGlyphs">n/a</text><rect x="18" y="726" width="324" height="1" rx="0" fill="#eaeef2" /><g stroke="#536170" stroke-width="1.2" fill="none"><rect x="18" y="744" width="9" height="8" rx="1.5"/><path d="M19 744 v-3 a3 3 0 0 1 6 0 v3"/></g><text x="35" y="751" font-size="14" font-weight="600" fill="#1f2328" text-anchor="start" textLength="222.04" lengthAdjust="spacingAndGlyphs">Wireless ESL / EPD display</text><text x="18" y="788" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="297.375" lengthAdjust="spacingAndGlyphs">Firmware for battery-powered electronic</text><text x="18" y="806" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="320.25" lengthAdjust="spacingAndGlyphs">shelf labels driving e-paper panels over a</text><text x="18" y="824" font-size="12.5" font-weight="400" fill="#536170" text-anchor="start" textLength="99.125" lengthAdjust="spacingAndGlyphs">wireless link</text><rect x="18" y="854" width="24.71" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="27" y="869" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="6.71" lengthAdjust="spacingAndGlyphs">C</text><rect x="48.71" y="854" width="64.97" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="57.71" y="869" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="46.97" lengthAdjust="spacingAndGlyphs">e-paper</text><rect x="119.68" y="854" width="38.13" height="22" rx="5" fill="#0969da" fill-opacity="0.12"/><text x="128.68" y="869" font-size="11" font-weight="500" fill="#0969da" text-anchor="start" textLength="20.13" lengthAdjust="spacingAndGlyphs">BLE</text><text x="18" y="900" font-size="10" font-weight="400" fill="#53617