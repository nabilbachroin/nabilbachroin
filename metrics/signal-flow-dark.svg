<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-labelledby="title desc">
<title id="title">Animated embedded systems signal flow</title>
<desc id="desc">Conceptual control and audio paths with animated data packets flowing through a firmware core, wireless and USB interfaces, codec and DSP stages.</desc>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#25303b" stroke-width=".6" opacity=".45"/></pattern>
<linearGradient id="header" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#35d4e8"/><stop offset=".48" stop-color="#b889ff"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<linearGradient id="control" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#35d4e8"/><stop offset="1" stop-color="#58a6ff"/></linearGradient>
<linearGradient id="audio" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="860" y2="0"><stop stop-color="#39d98a"/><stop offset=".5" stop-color="#b889ff"/><stop offset="1" stop-color="#f778ba"/></linearGradient>
<filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".18"/></filter>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0}.trace{stroke-dasharray:7 9;animation:flow 1.7s linear infinite}.trace.audio{animation-duration:2.1s}.scan{animation:scan 3.6s ease-in-out infinite}.led{animation:blink 1.8s ease-in-out infinite}.packet{filter:url(#glow)}@keyframes flow{to{stroke-dashoffset:-32}}@keyframes scan{0%,100%{opacity:.15;transform:translateX(-30px)}50%{opacity:.7;transform:translateX(30px)}}@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.trace,.scan,.led{animation:none}.packet{display:none}}</style>
<rect x=".5" y=".5" width="879" height="329" rx="6" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="878" height="328" rx="6" fill="url(#grid)" opacity=".55"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="start" textLength="366" lengthAdjust="spacingAndGlyphs">EMBEDDED SYSTEMS / SIGNAL FLOW</text>
<text x="24" y="57" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="start" textLength="198.555" lengthAdjust="spacingAndGlyphs">CONCEPTUAL REAL-TIME DATA PATHS</text>
<path d="M24 74H856" stroke="url(#header)" stroke-width="1.5"/>
<path class="scan" d="M24 74H170" stroke="url(#header)" stroke-width="4" filter="url(#glow)"/>
<text x="24" y="103" font-size="10.5" font-weight="700" fill="#35d4e8" text-anchor="start" textLength="83.265" lengthAdjust="spacingAndGlyphs">CONTROL / HID</text>
<text x="24" y="235" font-size="10.5" font-weight="700" fill="#39d98a" text-anchor="start" textLength="89.67" lengthAdjust="spacingAndGlyphs">AUDIO PIPELINE</text>
<path d="M164 143H260" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace control" d="M164 143H260" fill="none" stroke="url(#control)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#control)"><animateMotion path="M164 143H260" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
<path d="M440 143H512V124H620" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace control" d="M440 143H512V124H620" fill="none" stroke="url(#control)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#control)"><animateMotion path="M440 143H512V124H620" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
<path d="M512 143V188H620" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace control" d="M512 143V188H620" fill="none" stroke="url(#control)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#control)"><animateMotion path="M512 143V188H620" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
<path d="M150 275H227" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace audio" d="M150 275H227" fill="none" stroke="url(#audio)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#audio)"><animateMotion path="M150 275H227" dur="1.7s" begin="0.2s" repeatCount="indefinite"/></circle>
<path d="M337 275H394" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace audio" d="M337 275H394" fill="none" stroke="url(#audio)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#audio)"><animateMotion path="M337 275H394" dur="1.4s" begin="0.7s" repeatCount="indefinite"/></circle>
<path d="M494 275H550" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace audio" d="M494 275H550" fill="none" stroke="url(#audio)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#audio)"><animateMotion path="M494 275H550" dur="1.4s" begin="0.1s" repeatCount="indefinite"/></circle>
<path d="M670 275H724" fill="none" stroke="#303b46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path class="trace audio" d="M670 275H724" fill="none" stroke="url(#audio)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="packet" r="4" fill="url(#audio)"><animateMotion path="M670 275H724" dur="1.5s" begin="0.8s" repeatCount="indefinite"/></circle>
<g filter="url(#soft)"><rect x="64" y="119" width="100" height="48" rx="5" fill="#151b23" stroke="#35d4e8" stroke-width="1.2"/><path d="M71 127V159" stroke="#35d4e8" stroke-width="3" stroke-linecap="round"/></g>
<text x="117" y="140" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="39.65" lengthAdjust="spacingAndGlyphs">INPUT</text>
<text x="117" y="158" font-size="9.5" font-weight="500" fill="#8b949e" text-anchor="middle" textLength="75.335" lengthAdjust="spacingAndGlyphs">keys / sensor</text>
<path d="M252 111.5H260M440 111.5H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<path d="M252 122H260M440 122H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<path d="M252 132.5H260M440 132.5H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<path d="M252 143H260M440 143H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<path d="M252 153.5H260M440 153.5H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<path d="M252 164H260M440 164H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<path d="M252 174.5H260M440 174.5H448" stroke="#647383" stroke-width="3" stroke-linecap="round"/>
<g filter="url(#soft)"><rect x="260" y="101" width="180" height="84" rx="7" fill="#151b23" stroke="url(#control)" stroke-width="1.5"/><rect x="269" y="110" width="162" height="66" rx="4" fill="#111820" stroke="#25303b" stroke-dasharray="3 4"/></g>
<circle class="led" cx="423" cy="118" r="3.5" fill="#39d98a" filter="url(#glow)"/>
<text x="350" y="139" font-size="14" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="111.02" lengthAdjust="spacingAndGlyphs">FIRMWARE CORE</text>
<text x="350" y="160" font-size="9.5" font-weight="600" fill="#35d4e8" text-anchor="middle" textLength="81.13" lengthAdjust="spacingAndGlyphs">RTOS | C | ISR</text>
<g filter="url(#soft)"><rect x="620" y="100" width="142" height="48" rx="5" fill="#151b23" stroke="#58a6ff" stroke-width="1.2"/><path d="M627 108V140" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/></g>
<text x="694" y="121" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="63.44" lengthAdjust="spacingAndGlyphs">BLE LINK</text>
<text x="694" y="139" font-size="9.5" font-weight="500" fill="#8b949e" text-anchor="middle" textLength="46.36" lengthAdjust="spacingAndGlyphs">wireless</text>
<g filter="url(#soft)"><rect x="620" y="164" width="142" height="48" rx="5" fill="#151b23" stroke="#b889ff" stroke-width="1.2"/><path d="M627 172V204" stroke="#b889ff" stroke-width="3" stroke-linecap="round"/></g>
<text x="694" y="185" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="55.51" lengthAdjust="spacingAndGlyphs">USB HID</text>
<text x="694" y="203" font-size="9.5" font-weight="500" fill="#8b949e" text-anchor="middle" textLength="28.975" lengthAdjust="spacingAndGlyphs">wired</text>
<g filter="url(#soft)"><rect x="50" y="251" width="100" height="48" rx="5" fill="#151b23" stroke="#39d98a" stroke-width="1.2"/><path d="M57 259V291" stroke="#39d98a" stroke-width="3" stroke-linecap="round"/></g>
<text x="103" y="279" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="58.56" lengthAdjust="spacingAndGlyphs">AUDIO IN</text>
<g filter="url(#soft)"><rect x="227" y="251" width="110" height="48" rx="5" fill="#151b23" stroke="#b889ff" stroke-width="1.2"/><path d="M234 259V291" stroke="#b889ff" stroke-width="3" stroke-linecap="round"/></g>
<text x="285" y="272" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="39.65" lengthAdjust="spacingAndGlyphs">CODEC</text>
<text x="285" y="290" font-size="9.5" font-weight="500" fill="#8b949e" text-anchor="middle" textLength="57.95" lengthAdjust="spacingAndGlyphs">Opus / LC3</text>
<g filter="url(#soft)"><rect x="394" y="251" width="100" height="48" rx="5" fill="#151b23" stroke="#f778ba" stroke-width="1.2"/><path d="M401 259V291" stroke="#f778ba" stroke-width="3" stroke-linecap="round"/></g>
<text x="447" y="272" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="23.79" lengthAdjust="spacingAndGlyphs">DSP</text>
