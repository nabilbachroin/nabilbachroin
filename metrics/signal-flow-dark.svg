<text x="613" y="279" font-size="12" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="65.88" lengthAdjust="spacingAndGlyphs">AUDIO OUT</text>
<g filter="url(#soft)"><rect x="724" y="251" width="112" height="48" rx="5" fill="#151b23" stroke="#58a6ff" stroke-width="1.2"/><path d="M731 259V291" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/></g>
<text x="783" y="279" font-size="11.5" font-weight="700" fill="#e6edf3" text-anchor="middle" textLength="56.12" lengthAdjust="spacingAndGlyphs">PLAYBACK</text>
</svg>