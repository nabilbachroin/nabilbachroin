<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700" role="img" aria-labelledby="title description">
<title id="title">Contribution Activity Console</title>
<desc id="description">A custom GitHub contribution dashboard showing an animated three-dimensional monthly activity pulse, streaks, aggregate signals and anonymized private activity.</desc>
<defs>
<linearGradient id="spectrum"><stop stop-color="#20bcd4"/><stop offset=".34" stop-color="#38c976"/><stop offset=".67" stop-color="#a58af5"/><stop offset="1" stop-color="#f16ca6"/></linearGradient>
<filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:0}.bar-3d{animation:rise .85s cubic-bezier(.2,.8,.2,1) var(--delay) both;transform-box:fill-box;transform-origin:center bottom}.pulse-line{stroke-dasharray:8 9;animation:flow 2.1s linear infinite}.beacon{animation:pulse 2.8s ease-in-out infinite}.scanner{animation:scan 7s linear infinite}.status{animation:pulse 2.4s ease-in-out infinite}@keyframes rise{from{opacity:.2;transform:scaleY(.06)}to{opacity:1;transform:scaleY(1)}}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.64}}@keyframes flow{to{stroke-dashoffset:-34}}@keyframes scan{from{transform:translateX(0)}to{transform:translateX(var(--travel))}}@media(prefers-reduced-motion:reduce){.bar-3d,.pulse-line,.beacon,.scanner,.status{animation:none}}</style>
