name: Snake

on:
  schedule:
    - cron: "53 17 * * *" # 30 min after the metrics job; odd minute avoids the :00 load spike
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake-publication
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#f4c95d&color_dots=#ebedf0,#20bcd4,#38c976,#a58af5,#f16ca6
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4c95d&color_dots=#161b22,#20bcd4,#38c976,#a58af5,#f16ca6

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
