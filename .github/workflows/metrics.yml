name: Metrics

on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC = 00:00 WIB / 01:00 Taipei
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

# PRIVACY CONTRACT
# ----------------
# This repository is public. 54 of 70 repositories are private and several are
# under NDA (client and product names appear in repository names).
#
# Rules enforced below:
#   1. Plugins that render repository names, commit messages, or source code
#      are NEVER enabled: plugin_activity, plugin_repositories, plugin_code,
#      plugin_projects, plugin_topics, plugin_notable.
#   2. `base` excludes the `activity` and `repositories` sections for the same
#      reason. Only aggregate counters are rendered.
#   3. Anything that would leak an identifier into this public YAML file
#      (author emails, the vendor-SDK skip list) is read from a repository
#      secret instead of being hardcoded.

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1 ── Overview: aggregate counters + full-year isometric calendar
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nabilbachroin
          filename: metrics/overview.svg
          template: classic
          base: header, community, metadata
          config_timezone: Asia/Taipei
          repositories_affiliations: owner
          commits_authoring: ${{ secrets.COMMITS_AUTHORING }}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_lines_sections: base
          use_prebuilt_image: yes

      # 2 ── Languages: vendored SDKs excluded so the chart reflects code you wrote
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nabilbachroin
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Taipei
          repositories_affiliations: owner
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          # Vendor SDK repos to exclude — kept in a secret, comma separated,
          # so the repo names never appear in this public file.
          plugin_languages_skipped: ${{ secrets.LANGUAGES_SKIPPED }}
          plugin_languages_ignored: >-
            makefile, cmake, linker script, batchfile, roff, m4,
            smpl, perl, objective-c, dockerfile, hex
          use_prebuilt_image: yes

      # 3 ── Habits: when you code. Charts only, no repository names.
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: nabilbachroin
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Taipei
          commits_authoring: ${{ secrets.COMMITS_AUTHORING }}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          use_prebuilt_image: yes

      # 4 ── WakaTime (OPTIONAL): real editor hours, independent of repo visibility.
      #      This is the single best fix for a mostly-private profile.
      #      Uncomment after you create a WakaTime account and add WAKATIME_TOKEN.
      #
      # - name: WakaTime
      #   uses: lowlighter/metrics@latest
      #   with:
      #     token: NOT_NEEDED
      #     user: nabilbachroin
      #     filename: metrics/wakatime.svg
      #     base: ""
      #     config_timezone: Asia/Taipei
      #     plugin_wakatime: yes
      #     plugin_wakatime_token: ${{ secrets.WAKATIME_TOKEN }}
      #     plugin_wakatime_days: 7
      #     plugin_wakatime_sections: time, languages, projects, editors
      #     use_prebuilt_image: yes
